<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chikor QR Studio - Ultimate Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        
        /* شريط ألوان متطابق 100% بدون أي انعكاس */
        .color-spectrum {
            -webkit-appearance: none;
            width: 100%;
            height: 26px;
            border-radius: 13px;
            background: linear-gradient(to right, 
                #ff0000 0%, 
                #ffff00 17%, 
                #00ff00 33%, 
                #00ffff 50%, 
                #0000ff 67%, 
                #ff00ff 83%, 
                #ff0000 100%
            );
            outline: none;
            cursor: pointer;
            border: 2px solid #334155;
        }
        .color-spectrum::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--thumb-bg, #00f2fe);
            border: 3px solid #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            transition: background 0.1s ease;
        }

        #welcome-screen {
            animation: fadeOut 0.8s ease 2.2s forwards;
        }
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; pointer-events: none; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 md:p-6 overflow-x-hidden">

    <!-- شاشة الترحيب الفخمة -->
    <div id="welcome-screen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center text-center p-6">
        <div class="space-y-3">
            <h1 class="text-3xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-400 to-pink-500 tracking-wider">
                WELCOME TO WEBSITE
            </h1>
            <p class="text-sm sm:text-lg font-bold text-slate-300 tracking-widest uppercase">
                DEVELOPER : <span class="text-cyan-400 font-black">CHIKOR</span>

            <div class="w-20 h-1 bg-gradient-to-r from-cyan-500 to-pink-500 mx-auto rounded-full animate-pulse mt-4"></div>

    <!-- الحاوية المتجاوبة للموقع -->

                    <span>⚡</span> CHIKOR QR STUDIO

                <p class="text-slate-400 text-xs sm:text-sm mt-1">توليد نصوص صريحة، ألوان دقيقة، وأكثر من 200 شعار فريد.</p>

            <!-- حقل الإدخال -->

            </div>

            <!-- شريط الألوان الدقيق والمتطابق 100% -->
            <div class="space-y-4 pt-2 border-t border-slate-800">
                <h3 class="text-xs sm:text-sm font-bold text-cyan-300">🎨 شريط الألوان الدقيق (Color Precision):</h3>
                
                <!-- شريط لون الكود -->
                <div class="space-y-2 bg-slate-950/50 p-3 rounded-2xl border border-slate-800">

        <!-- قسم المعاينة والتحميل -->

            <div class="w-full space-y-2.5">

                    <span>🚀</span> تحميل بجودة فائقة (HD PNG)
                </button>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="qrCode.download({name: 'chikor-qr', extension: 'svg'})" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 px-3 rounded-xl transition text-xs cursor-pointer">
                        تحميل Vector (SVG)

    <!-- نافذة مكتبة الشعارات (تضم أكثر من 200 شعار فريد بالكامل) -->

    <script>
        let logoSrc = null;
        let currentCodeColor = "#00F2FE";
        let currentBgColor = "#FFFFFF";
        let currentRawData = "أهلاً بك! هذا نص عربي سليم 100%.";

        // دالة تحويل أي نص عربي أو رموز خاصة إلى بايتات UTF-8 نقية لكي تفهمها كاميرا ومستشعر الـ QR
        function toUtf8(str) {
            if (!str) return "";
            try {
                return unescape(encodeURIComponent(str));
            } catch (e) {
                return str;
            }
        }

        // تبديل أنواع الإدخال
        function switchType(type) {
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.className = "type-btn bg-slate-800 text-slate-300 font-bold py-2.5 px-2 rounded-xl transition";
            });
            document.getElementById(`btn-${type}`).className = "type-btn bg-cyan-600 text-white font-bold py-2.5 px-2 rounded-xl transition shadow";

            const container = document.getElementById('input-container');
            if (type === 'text') {
                container.innerHTML = `<label class="text-xs text-slate-400 font-semibold block">النص الصافي (يظهر تماماً كما تكتبه دون أي تشويه):</label><textarea id="raw-data-input" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs sm:text-sm text-white focus:border-cyan-500 outline-none h-20" oninput="updateQRData()">أهلاً بك! هذا نص عربي سليم 100%.</textarea>`;
            } else if (type === 'url') {
                container.innerHTML = `<label class="text-xs text-slate-400 font-semibold block">الرابط أو الموقع الإلكتروني:</label><input type="text" id="raw-data-input" value="https://github.com/youcefchikor31-ctrl" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white focus:border-cyan-500 outline-none" oninput="updateQRData()">`;
            } else if (type === 'phone') {
                container.innerHTML = `<label class="text-xs text-slate-400 font-semibold block">رقم الهاتف الصريح:</label><input type="text" id="raw-data-input" value="0678901234" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white focus:border-cyan-500 outline-none" oninput="updateQRData()">`;
            } else if (type === 'sms') {
                container.innerHTML = `<label class="text-xs text-slate-400 font-semibold block">نص رسالة الـ SMS المباشرة:</label><input type="text" id="raw-data-input" value="رسالة نصية فورية" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white focus:border-cyan-500 outline-none" oninput="updateQRData()">`;
            } else if (type === 'wifi') {
                container.innerHTML = `
                    <div class="space-y-2">
                        <input type="text" id="wifi-ssid" placeholder="اسم شبكة الواي فاي (SSID)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none" oninput="updateWifiData()">
                        <input type="text" id="wifi-pass" placeholder="كلمة المرور" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none" oninput="updateWifiData()">
                    </div>`;
            }
            updateQRData();
        }

        function updateQRData() {
            const input = document.getElementById('raw-data-input');
            currentRawData = input ? input.value : "";
            qrCode.update({ data: toUtf8(currentRawData) });
        }

        function updateWifiData() {
            const ssid = document.getElementById('wifi-ssid')?.value || "";
            const pass = document.getElementById('wifi-pass')?.value || "";
            currentRawData = `WIFI:S:${ssid};T:WPA;P:${pass};;`;
            qrCode.update({ data: toUtf8(currentRawData) });
        }

        // تحويل درجات التدرج اللوني بدقة متناهية
        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
        }

        function applyCodeColor(hue) {
            currentCodeColor = hslToHex(Number(hue), 100, 50);
            document.getElementById('code-color-hex').textContent = currentCodeColor;
            document.getElementById('code-color-preview').style.backgroundColor = currentCodeColor;
            document.getElementById('code-hue').style.setProperty('--thumb-bg', currentCodeColor);
            refreshQR();
        }

        function setCodeColorDirect(hex) {
            currentCodeColor = hex;
            document.getElementById('code-color-hex').textContent = currentCodeColor;
            document.getElementById('code-color-preview').style.backgroundColor = currentCodeColor;
            document.getElementById('code-hue').style.setProperty('--thumb-bg', currentCodeColor);
            refreshQR();
        }

        function applyBgColor(hue) {
            currentBgColor = hslToHex(Number(hue), 100, 50);
            document.getElementById('bg-color-hex').textContent = currentBgColor;
            document.getElementById('bg-color-preview').style.backgroundColor = currentBgColor;
            document.getElementById('bg-hue').style.setProperty('--thumb-bg', currentBgColor);
            refreshQR();
        }

        function setBgColorDirect(hex) {
            currentBgColor = hex;
            document.getElementById('bg-color-hex').textContent = currentBgColor;
            document.getElementById('bg-color-preview').style.backgroundColor = currentBgColor;
            document.getElementById('bg-hue').style.setProperty('--thumb-bg', currentBgColor);
            refreshQR();
        }

        const logosGrid = document.getElementById('logos-grid');
        logosList.forEach((logo, index) => {
            const btn = document.createElement('button');
            btn.className = "bg-slate-950 border border-slate-800 hover:border-cyan-500 p-2 rounded-xl flex flex-col items-center justify-center gap-1 transition cursor-pointer group";
            btn.innerHTML = `
                <img src="${logo.url}" alt="${logo.name}" class="w-6 h-6 sm:w-7 sm:h-7 object-contain group-hover:scale-110 transition">
                <span class="text-[8px] sm:text-[9px] text-slate-400 truncate w-full text-center">${index + 1}. ${logo.name}</span>
            `;
            btn.onclick = () => {
                logoSrc = logo.url;
                refreshQR();
                closeLogoModal();
            };
            logosGrid.appendChild(btn);
        });

        function openLogoModal() { document.getElementById('logo-modal').classList.remove('hidden'); }
        function closeLogoModal() { document.getElementById('logo-modal').classList.add('hidden'); }
        function removeLogo() { logoSrc = null; refreshQR(); }

        // تهيئة محرك الباركود مع معالجة الـ UTF-8
        const qrCode = new QRCodeStyling({
            width: 220,
            height: 220,
            type: "canvas",
            data: toUtf8(currentRawData),
            dotsOptions: { color: currentCodeColor, type: "square" },
            cornersSquareOptions: { color: currentCodeColor, type: "square" },
            backgroundOptions: { color: currentBgColor },
            imageOptions: { hideBackgroundDots: true, imageSize: 0.35, margin: 4 }
        });

        qrCode.append(document.getElementById("canvas-container"));

        function refreshQR() {
            const dotStyle = document.getElementById('dot-style').value;
            const cornerStyle = document.getElementById('corner-style').value;

            qrCode.update({
                data: toUtf8(currentRawData),
                dotsOptions: { color: currentCodeColor, type: dotStyle },
                cornersSquareOptions: { color: currentCodeColor, type: cornerStyle },
                backgroundOptions: { color: currentBgColor },
                image: logoSrc
            });
        }

        // تحميل فائق الدقة بدون أي تشويش
        function downloadHD() {
            const dotStyle = document.getElementById('dot-style').value;
            const cornerStyle = document.getElementById('corner-style').value;

            const hdQr = new QRCodeStyling({
                width: 1200,
                height: 1200,
                type: "canvas",
                data: toUtf8(currentRawData),
                dotsOptions: { color: currentCodeColor, type: dotStyle },
                cornersSquareOptions: { color: currentCodeColor, type: cornerStyle },
                backgroundOptions: { color: currentBgColor },
                image: logoSrc,
                imageOptions: { hideBackgroundDots: true, imageSize: 0.35, margin: 18 }
            });

            hdQr.download({ name: "chikor-studio-qr-HD", extension: "png" });
        }
